<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>かずあそび</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#fff8ee">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="app.css">
</head>
<body class="home">
<div id="home">
  <h1 id="homeTitle">かずあそび</h1>
  <div id="homeCards">
    <button class="hcard" data-mode="write">
      <span class="hicon">✏️</span><span class="hlabel">かく</span>
    </button>
    <button class="hcard" data-mode="quiz">
      <span class="hicon">🔢</span><span class="hlabel">えらぶ</span>
    </button>
    <button class="hcard" data-mode="shop">
      <span class="hicon">🍎</span><span class="hlabel">おみせ</span>
    </button>
    <button class="hcard" data-mode="compare">
      <span class="hicon">⚖️</span><span class="hlabel">くらべる</span>
    </button>
    <button class="hcard" data-mode="order">
      <span class="hicon">📶</span><span class="hlabel">じゅんばん</span>
    </button>
    <button class="hcard" data-mode="nanko">
      <span class="hicon">🧮</span><span class="hlabel">なんこかな</span>
      <span class="hnote">※むずかしい</span>
    </button>
  </div>
  <button id="homeSpeak" aria-label="もういちど きく">🔊</button>
</div>
<div id="app">
  <div id="side">
    <div id="modes">
      <button id="homeBtn" aria-label="おうちに もどる">🏠</button>
    </div>
    <div class="panel" id="target">
      <div id="targetNum">1</div>
      <div id="targetDots"></div>
      <div id="orderItem"></div>
      <div id="ordAsk" aria-hidden="true"></div>
      <div id="nkSide"></div>
      <div id="cmpAsk" aria-hidden="true">
        <span class="cmpAskSide many"><i></i><i></i><i></i><i></i><i></i><i></i></span>
        <span class="cmpAskSide few"><i></i><i></i></span>
      </div>
      <button id="speak" aria-label="よみあげ">🔊</button>
      <button id="bigSpeak" aria-label="もういちど きく">🔊</button>
    </div>
    <div class="panel" id="stars"></div>
  </div>
  <div id="stage">
    <canvas id="board"></canvas>
    <div id="nav">
      <button id="prev" aria-label="まえ">◀</button>
      <button id="again" aria-label="もういちど">↺</button>
      <button id="nkDone" aria-label="かけた">できた</button>
      <button id="next" aria-label="つぎ">▶</button>
    </div>
    <div id="quiz">
      <div id="qChoices"></div>
    </div>
    <div id="shop">
      <div id="shelf"></div>
      <div id="basketWrap">
        <div id="basket"></div>
        <button id="done">できた</button>
      </div>
    </div>
    <div id="nanko">
      <div id="nkItems"></div>
      <div id="nkChoices"></div>
    </div>
    <div id="order">
      <div id="ordRow"></div>
    </div>
    <div id="compare">
      <div id="cmpRow">
        <button class="cmpCard" id="cmpA"></button>
        <button class="cmpCard" id="cmpB"></button>
      </div>
    </div>
  </div>
</div>
<div id="reward"><div id="rewardText"></div></div>
<canvas id="confetti"></canvas>
<script src="voices.js"></script>
<script src="strokes.js"></script>
<script src="app.js"></script>
</body>
</html>
